---
- hosts: all
  become: yes
  tasks: 
  - name: i want to install webserver on this task01 (apt-get install apache2 -y )
    apt:
      name: apache2
      state: present 


  - name: i want to start webserver on this task02 (service apache2 start)
    service:
      name: apache2
      state: started
  
  





   


  