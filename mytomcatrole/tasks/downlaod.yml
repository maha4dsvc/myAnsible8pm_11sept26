---
- name: download tomcat tar file
  get_url:
    url: https://dlcdn.apache.org/tomcat/tomcat-10/v10.1.60/bin/apache-tomcat-10.1.60.tar.gz
    dest: /home/maha/apache-tomcat-10.1.60.tar.gz
    force_basic_auth: yes

- name: create a tomcat folder 
  file:
    path: /opt/tomcat
    state: directory

- name: extract tar file 
  unarchive:
    src: /home/maha/apache-tomcat-10.1.60.tar.gz
    dest: /opt/tomcat